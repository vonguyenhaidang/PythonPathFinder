/* ===== Soft minimal education theme (white, calm, consistent) ===== */
:root{--bg:#fff;--card:#fff;--tx:#2b3447;--mu:#6f7a90;--bd:#e9edf4;--ac:#9a3f70;--ac2:#7e2f5a;--tint:#faf3f7;--dk:#2f3b55;--tr:#eef1f6;--ok:#3f8f73;--wa:#d9983f;--sage:#eef7f3;--sky:#f1f7fc;--bl:#5b9bd0}

function route(s,goal,sp,exp,as,ix){
  const hide=[],soft=[],add=(c,t,h)=>c&&(h?hide:soft).push(t);
  add(ix.HYPE==='HIGH','FOMO / kỳ vọng từ quảng cáo, AI');add(ix.INTENT==='EXTERNAL','Động lực chủ yếu từ bên ngoài');add(ix.INTENT==='FAMILY_LED','Chủ yếu do gia đình gợi ý, chưa có lý do riêng');add(ix.FIT==='MISALIGNED','Điều bạn ngại là phần cốt lõi của chương trình');add(ix.GOAL==='VAGUE'&&['UNSURE','PEER','PARENT'].includes(s.mainGoal),'Mục tiêu chưa rõ');add(s.mainGoal==='SCHOOL'&&!!s.schoolFit&&s.schoolFit!=='py','Trường không dùng Python',1);add(s.careerView==='quick'&&ix.INTENT!=='SELF','Kỳ vọng nghề nghiệp chưa thực tế');
  if(hide.length)return{hide};
  const g=parseInt(s.grade.slice(4)),all=[s.interests,s.personalAreas,[s.projectInterest,s.exploreInterest,s.futureArea]].flat(),game=all.some(x=>GAMEK.includes(x)),ai=all.some(x=>AIK.includes(x)),nw=sp==='NEW_TO_PROGRAMMING'||sp==='NEW_TO_PYTHON',ex=sp==='PYTHON_EXPERIENCED';
  const m=soft.length?'E':g<9&&goal!=='PCEP'?'E':ex&&game?'F':nw&&goal==='EXPLORE'?'E':'G',pr=exp==='PROJECT';let c=null;
  if(sp!=='UNKNOWN'){
    if(m==='E')c=sp==='NEW_TO_PROGRAMMING'?311:sp==='PYTHON_EXPERIENCED'?(pr?491:401):312;
    else if(m==='F')c=411;

  if(c===null&&soft.length)c=311;
  return{m,c,soft};
}

// Goal after resolving the "friends" branch (peer motivation alone never decides the path)
function effectiveGoal(s){
  if(s.ownMotivation==='others'||s.mainGoal==='PARENT')return 'EXPLORE';   // ý muốn chủ yếu từ người lớn: bắt đầu nhẹ, không áp mục tiêu lớn
  if(s.mainGoal!=='PEER')return s.mainGoal||'UNSURE';
  if(['yes','prob'].includes(s.peerMotivation)&&s.actualGoalAfterPeer)return s.actualGoalAfterPeer;
  return s.peerMotivation==='no'?'EXPLORE':'UNSURE';
}
function pick_(a){return a.filter(x=>x!=='Unsure'&&x!=='No')}
const RK=['NONE','EXPOSED','BASIC','REGULAR','PROJECT'];
const PROBE_ANS={probe1:'7',probe2:'012',probe3:'6'};
const EV_LBL=['Chưa có','Mới tiếp xúc','Cơ bản','Khá','Đã làm dự án'];
// Đối chiếu lời tự nhận (nhãn, kỹ năng) với bằng chứng (kiểm tra nhanh) và các dấu hiệu "ý muốn đến từ người lớn".
function assess(s){
  const sk=s.pythonSkills.filter(x=>x!=='none'),n=sk.length;
  let ev=n===0?0:n<=2?1:n<=6?2:n<=8?3:4;
  const shown=Object.keys(PROBE_ANS).filter(k=>s[k]),fail=shown.filter(k=>s[k]!==PROBE_ANS[k]);
  if(fail.length>=2)ev=Math.min(ev,1);else if(fail.length===1)ev=Math.min(ev,2);
  const lab={A:0,B:1,C:2,D:2,E:3}[s.pythonExperience],over=lab!==undefined&&lab-ev>=2;
  const f=[];let pt=0;const add=(c,p,t)=>{if(c){pt+=p;f.push(t)}};
  add(s.respondent==='parent',3,'Phụ huynh trả lời hộ học sinh');
  add(s.respondent==='assist',1,'Có người lớn ngồi cạnh khi làm bài');
  add(s.whoSuggested==='parent',1,'Bài đánh giá do bố mẹ đề nghị');
  add(s.ownMotivation==='others',2,'Học sinh cho biết chủ yếu do người lớn muốn');
  add(s.ownMotivation==='half',1,'Động lực chia đôi giữa học sinh và người lớn');
  add(s.mainGoal==='PARENT',1,'Học sinh chưa có mục tiêu riêng');
  add(s.goalAlignment==='diff',1,'Mục tiêu của học sinh khác mong muốn của bố mẹ');
  add(over,2,'Tự nhận kinh nghiệm cao hơn bằng chứng (kỹ năng đã làm / kiểm tra nhanh)');
  add(fail.length>0&&lab>=2,1,'Sai '+fail.length+'/'+shown.length+' câu kiểm tra nhanh dù tự nhận đã biết');
  add(lab>=2&&['old','never'].includes(s.lastPythonUse),1,'Tự nhận có kinh nghiệm nhưng đã lâu không viết code');
  add(['own','mostly'].includes(s.ownMotivation)&&s.selfActions.includes('none'),1,'Nói rất muốn học nhưng chưa tự làm việc nào gần đây');
  add(s.mainGoal==='PCEP'&&!!s.pcepAwareness&&s.pcepAwareness!=='right',1,'Chọn mục tiêu PCEP nhưng chưa hiểu rõ chứng chỉ này');
  add(s.mainGoal==='PCEP'&&s.pcepDecider==='parent',1,'Ý định thi PCEP xuất phát từ bố mẹ');
  return{ev,lab,fail:fail.length,shown:shown.length,over,flags:f,score:pt,level:pt>=3?'LOW':pt>=1?'MEDIUM':'HIGH'};
}

  return `<div class="card" style="margin-bottom:16px;border-color:#ecd3a3"><div class="eyebrow">Dành cho tư vấn viên (staff=1)</div><h3>Độ tin cậy của câu trả lời: ${LV[r.level]} (${r.score} điểm cảnh báo)</h3><table class="t"><tr><td>Học sinh tự nhận</td><td>${esc(S.pythonExperience||'-')}</td></tr><tr><td>Bằng chứng kỹ năng</td><td>${EV_LBL[r.ev]} · ${S.pythonSkills.filter(x=>x!=='none').length} kỹ năng</td></tr><tr><td>Kiểm tra nhanh</td><td>${data._derived.quickCheck}</td></tr><tr><td>Người đề nghị</td><td>${esc(S.whoSuggested||'-')}</td></tr><tr><td>Người trả lời</td><td>${esc(S.respondent||'-')}</td></tr><tr><td>Động lực tự thân</td><td>${esc(S.ownMotivation||'-')}</td></tr><tr><td>Thời gian thực tế / tuần</td><td>${esc(S.weeklyTime||'-')}</td></tr>${Object.entries(a.ix).map(([k,v])=>`<tr><td>Chỉ mục ${k}</td><td>${v}</td></tr>`).join('')}<tr><td>Module · môn</td><td>${a.module?a.module+' · '+a.course.c+' '+a.course.n:'-'}</td></tr><tr><td>Lý do chuyển về Module nền tảng</td><td>${a.hide.join('; ')||'-'}</td></tr><tr><td>Lý do chuyển về Module E</td><td>${a.soft.join('; ')||'-'}</td></tr><tr><td>Rule lời khuyên khớp</td><td>${advHits(a.ix,S).map(r=>r.id).join(', ')}</td></tr></table>${r.flags.length?'<ul>'+r.flags.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<p class="mu">Không có dấu hiệu bất thường.</p>'}${S.reasonText?`<p><b>Lời học sinh viết:</b> ${esc(S.reasonText)}</p>`:''}<details><summary>Dữ liệu thô (JSON)</summary><pre>${esc(JSON.stringify(data,null,1))}</pre></details></div>`}

// INTENT   : SELF | MIXED | FAMILY_LED | EXTERNAL      — động lực đến từ đâu, có hành động thật đi kèm không
// HYPE     : LOW | MEDIUM | HIGH                       — tín hiệu FOMO / quảng cáo / kỳ vọng "nhờ AI là đủ"
// FIT      : ALIGNED | PARTIAL | MISALIGNED            — mức khớp giữa điều bạn thích/ngại và hoạt động học thực tế (tự gõ code, đọc lỗi, luyện tập, học từng bước, tiếng Anh)
// GRIT     : HIGH | MEDIUM | LOW | UNKNOWN             — cách xử lý việc khó trong quá khứ và giả định khi gặp khó
// COMMIT   : REALISTIC | TIGHT | LOW                   — thời gian luyện tập, lịch hoạt động hiện có, kế hoạch học
// GOAL     : CLEAR | FORMING | VAGUE                   — mục tiêu có đo được, có hành động, có lý do chọn Python không

const CORE=['type','err','rep','step','eng'];
function indices(s,as){
  const n=a=>a.filter(x=>x!=='none').length,sa=n(s.selfActions);
  let h=({main:2,part:1}[s.hypeImpact]||0)+(s.aiView==='enough'?1:0)+(s.afterThree==='big'?1:0)+(['easy','ad'].includes(s.whyPython)?1:0)+(s.careerView==='quick'?1:0)+(s.aiUse==='nocode'&&s.aiView==='enough'?1:0);
  const HYPE=h>=3?'HIGH':h>=1?'MEDIUM':'LOW';
  const cl=s.classLike.filter(x=>CORE.includes(x)).length,cw=s.classWorry.filter(x=>CORE.includes(x)).length;
  const FIT=cw>=2||(cl===0&&cw>=1)?'MISALIGNED':cl>=2&&cw===0?'ALIGNED':'PARTIAL';
  const g=({many:2,hint:2,pause:1,stop:0,none:1}[s.stuck]||0)+({still:2,done:2,other:1,never:1,hard:0}[s.quitHistory]||0)+({support:2,progress:2,pause:1,stop:0,unsure:0}[s.hardMoment]||0);
  const GRIT=s.stuck==='none'&&s.quitHistory==='never'?'UNKNOWN':g>=5?'HIGH':g>=3?'MEDIUM':'LOW';
  const c=({lt1:0,'1_2':1,'3_4':2,'5p':2,unsure:0}[s.weeklyTime]||0)+({'0_1':2,'2_3':1,'4_5':0,'6p':-1}[s.weeklyLoad]||0)+({fixed:2,free:1,wk:1,none:0}[s.practicePlan]||0);
  const COMMIT=c>=4?'REALISTIC':c>=2?'TIGHT':'LOW';
  const gl=(['PARENT','PEER','UNSURE'].includes(s.mainGoal)?0:1)+(['skill','product','mile'].includes(s.goalOutcome)?1:0)+(sa>0?1:0)+(s.whyPython==='fit'?1:0);
  const GOAL=gl>=3?'CLEAR':gl===2?'FORMING':'VAGUE';
  const peerWeak=s.mainGoal==='PEER'&&['unsure','no'].includes(s.peerMotivation);
  const INTENT=s.hypeImpact==='main'||peerWeak?'EXTERNAL':(s.ownMotivation==='others'||s.mainGoal==='PARENT')?'FAMILY_LED':(['own','mostly'].includes(s.ownMotivation)&&sa>0)?'SELF':'MIXED';
  return{INTENT,HYPE,FIT,GRIT,COMMIT,GOAL,RELIABILITY:as.level};
}

// MAIN FUNCTION: the Decision Matrix
function recommendPath(s){
  const goal=effectiveGoal(s), cs=CS(s);
  // 1. normalise Python experience
  let exp=EXP_MAP[s.pythonExperience]||'UNKNOWN';
  if(exp==='NONE'&&cs&&s.schoolLanguages.includes('Python'))exp='EXPOSED';
  if(s.pythonExperience==='E'&&s.pythonOutsideSchool==='projects')exp='PROJECT';
  const as=assess(s);
  if(s.pythonSkills.length){const cur=exp==='UNKNOWN'?4:RK.indexOf(exp);if(as.ev<cur)exp=RK[Math.max(as.ev,cur===1?1:0)];else if(exp==='UNKNOWN')exp=RK[Math.min(as.ev,3)]}
  // 2. programming background (New to Python != New to programming)
  const bg=s.programmingBackground.concat(cs?s.schoolLanguages.filter(x=>SCHOOL_PROG.includes(x)):[]);
  const hasProg=bg.some(x=>PROG.includes(x));
  // 3. starting point
  let sp;
  if(exp==='UNKNOWN')sp='UNKNOWN';
  else if(exp==='NONE'||exp==='EXPOSED')sp=hasProg?'NEW_TO_PYTHON':'NEW_TO_PROGRAMMING';
  else if(exp==='BASIC')sp='PYTHON_BEGINNER';
  else sp='PYTHON_EXPERIENCED';
  // 4. learning need
  let need;
  if(goal==='PCEP')need='CERTIFICATION';
  else if(sp==='NEW_TO_PROGRAMMING')need='FOUNDATION';
  else if(goal==='PROJECT')need='PROJECT_BUILDING';
  else if(sp==='PYTHON_EXPERIENCED')need='ADVANCEMENT';
  else if(goal==='EXPLORE'||goal==='UNSURE'||sp==='UNKNOWN')need='EXPLORATION';
  else need='STRUCTURED_LEARNING';
  // 5. recommendation (priority 1: PCEP; then matrix; unknown level -> check level first)
  const ix=indices(s,as),rt=route(s,goal,sp,exp,as,ix);let rec;
  if(rt.hide)rec='LOWER';
  else if(rt.soft.length)rec='MODULE_E';
  else if((goal==='PCEP'&&exp!=='NONE')||sp==='UNKNOWN'||(as.level==='LOW'&&sp!=='NEW_TO_PROGRAMMING'))rec='MOCK_TEST';
  else rec='MODULE_'+rt.m;
  const a={startingPoint:sp,experienceLevel:exp,goal,learningNeed:need,recommendation:rec,reliability:as,ix,hide:rt.hide||[],soft:rt.soft||[],module:rt.c?rt.m:null,course:rt.c?MODS[rt.m].courses.find(x=>x.c===rt.c):null};
  a.recommendationReason=buildReason(s,a);
  a.nextStep=PROGRAMS[rec].cta;
  return a;
}

// ========================================
// FLOW / BRANCHING
// ========================================
const flow=()=>Q.filter(q=>!q.show||q.show(S));
const qNow=()=>Q.find(q=>q.id===cur);
const nopt=o=>typeof o==='string'?{v:o,l:o}:{v:o[0],l:o[1]||o[0],x:o[2],sub:o[3]};
function nav(d){
  if(d>0&&view==='q'&&!valid(qNow())){msg=true;return render()}
  msg=false;const f=flow(),i=f.findIndex(q=>q.id===cur);
  if(view==='welcome'){view='intro'}
  else if(view==='intro'){if(d>0){view='q';cur=f[0].id}else view='welcome'}
  else if(view==='result'){view='q';cur=f[f.length-1].id}
  else if(d>0){if(i<f.length-1)cur=f[i+1].id;else view='result'}
  else{if(i>0)cur=f[i-1].id;else view='intro'}
  render();scrollTo(0,0);
}
function pick(q,k){
  const os=q.opts.map(nopt),o=os[k];
  if(q.type==='multi'){
    let a=S[q.key];
    if(a.includes(o.v))a=a.filter(x=>x!==o.v);
    else if(o.x)a=[o.v];
    else{a=a.filter(x=>!os.find(y=>y.v===x)?.x);if(q.max&&a.length>=q.max)return;a.push(o.v)}
    S[q.key]=a;
  }else{S[q.key]=o.v;if(q.key==='grade'&&S.school!=='__other'&&!schoolGroups().some(g=>g[1].includes(S.school)))S.school=''}
  msg=false;render();
}

// ========================================
// VALIDATION
// ========================================
function valid(q){
  if(q.type==='school')return !!S.school&&(S.school!=='__other'||S.schoolOther.trim()!=='');
  if(q.type==='text')return S[q.key].trim()!=='';
  if(q.type==='multi')return S[q.key].length>0;
  if(q.type==='dd')return q.dd.every(d=>S[d.key]);
  if(q.type==='info'||q.type==='long')return true;
  return !!S[q.key];
}

// VOICE GUIDE (giọng đọc nữ, nhẹ nhàng)
// ========================================
// Mặc định dùng giọng tiếng Việt có sẵn của trình duyệt (Web Speech API).
// Muốn giọng "studio" thật mượt: thu/ tạo sẵn file mp3 (ElevenLabs, Azure, Google TTS...) rồi điền URL vào audio, ví dụ:
//   audio:{intro:"audio/intro.mp3", thanks:"audio/thanks.mp3", name:"audio/name.mp3", grade:"audio/grade.mp3"}  (khoá = id câu hỏi)
const VOICE_CFG={audio:{}, rate:1.12, pitch:1.45};
const VOICE=(()=>{
  const ss=window.speechSynthesis, can=!!ss&&'SpeechSynthesisUtterance' in window;
  let on=true, voice=null, gen=0, audio=null, male=false;
  try{on=localStorage.getItem('pf_voice')!=='off'}catch(e){}
  const isMale=v=>/namminh|nam minh|\bmale\b|\bnam\b/i.test(v.name)&&!/female/i.test(v.name);
  const score=v=>{const n=v.name.toLowerCase();let x=0;if(isMale(v))x+=12;if(/natural|online|premium|enhanced/.test(n))x+=4;if(v.localService===false)x+=1;return x};
  function ui(){const b=document.getElementById('vt');if(!b)return;b.hidden=!can&&!Object.keys(VOICE_CFG.audio).length;b.textContent=on?'Giọng đọc: Bật':'Giọng đọc: Tắt'}
  function load(){if(!can)return;voice=ss.getVoices().filter(v=>/^vi/i.test(v.lang)).sort((a,b)=>score(b)-score(a))[0]||null;male=!!voice&&isMale(voice)}
  if(can){load();ss.addEventListener?ss.addEventListener('voiceschanged',load):(ss.onvoiceschanged=load)}
  const set=b=>document.body.classList.toggle('sp',!!b);
  const MAP=[[/LogiRobi/g,'Lô gi rô bi'],[/PCEP/g,'pi xi i pi'],[/C\+\+/g,'xi cộng cộng'],[/\bAI\b/g,'ây ai'],[/Python/g,'Pai thơn'],[/Logiscool/g,'Lô gít scul'],[/Scratch/g,'Xcrét'],[/\s*\/\s*/g,', ']];
  const clean=t=>MAP.reduce((a,m)=>a.replace(m[0],m[1]),t);
  function chunks(t){
    const parts=(t.match(/[^.!?…\n]+[.!?…]*/g)||[t]).map(x=>x.trim()).filter(Boolean),o=[];
    for(const p of parts){
      const pieces=p.length>170?p.split(/(?<=,)\s+/):[p];
      for(const q of pieces){if(o.length&&o[o.length-1].length+q.length<90)o[o.length-1]+=' '+q;else o.push(q)}
    }return o}
  function stop(){gen++;if(can)ss.cancel();if(audio){audio.pause();audio=null}set(false)}
  function play(key,text){
    const busy=can&&(ss.speaking||ss.pending);stop();if(!on)return;
    const url=VOICE_CFG.audio[key];
    if(url){audio=new Audio(url);audio.onplay=()=>set(true);audio.onended=audio.onerror=()=>set(false);audio.play().catch(()=>set(false));return}
    if(!can)return;const g=gen,cs=chunks(clean(text));
    const go=()=>{if(g!==gen)return;cs.forEach((c,i)=>{const u=new SpeechSynthesisUtterance(c);
      u.lang=voice?voice.lang:'vi-VN';if(voice)u.voice=voice;const e=c.slice(-1),lastC=i===cs.length-1;let pr=VOICE_CFG.pitch*(male?1:.88)+Math.sin(i*2.1)*.08+(i===0?.05:0),rt=VOICE_CFG.rate+Math.cos(i*1.7)*.045;if(e==='?'){pr+=.09;rt-=.02}else if(lastC){pr-=.05;rt-=.06}else if(/,/.test(c)){pr+=.02}u.pitch=Math.min(2,Math.max(.1,pr));u.rate=Math.min(2,Math.max(.5,rt));u.volume=1;
      if(i===0)u.onstart=()=>{if(g===gen)set(true)};
      if(i===cs.length-1)u.onend=u.onerror=()=>{if(g===gen)set(false)};
      ss.speak(u)})};
    busy?setTimeout(go,90):go()}
  function setOn(b){on=b;try{localStorage.setItem('pf_voice',on?'on':'off')}catch(e){}ui()}
  function toggle(){setOn(!on);if(!on)stop();else if(lastKey)speakFor(lastKey,true)}
  ui();
  return{play,stop,toggle,setOn,can,hasVoice:()=>!!voice};
})();

const N=Q.length,LB={s:'Một đáp án',m:'Nhiều đáp án',tf:'Đúng / Sai',x:'Kết quả chương trình'},HT={s:'Chọn một đáp án.',m:'Chọn TẤT CẢ đáp án đúng.',tf:'Chọn Đúng hoặc Sai.',x:'Gõ chính xác những gì chương trình in ra. Các dòng cách nhau bằng dấu cách hoặc xuống dòng.'};
let A,F,cur,end,tm,run,lost,away,auto,id,mode,rev,warn,ag,res;
const nz=s=>String(s).replace(/\s+/g,'').toLowerCase(),left=()=>Math.max(0,Math.round((end-Date.now())/1000)),mmss=r=>String(r/60|0).padStart(2,'0')+':'+String(r%60).padStart(2,'0');
function reset(){clearInterval(tm);A=Array(N).fill(null);F=Array(N).fill(false);cur=0;lost=0;away=auto=run=rev=warn=ag=false;res=null;mode='intro';id='LC-'+Date.now().toString(36).toUpperCase().slice(-6);document.body.classList.remove('aw')}
function tick(){if(!run)return;const r=left(),t=document.getElementById('tm');if(t){t.textContent=mmss(r);t.classList.toggle('lo',r<300)}
  if(r===300){const s=document.getElementById('ts');s.hidden=false;setTimeout(()=>s.hidden=true,5000)}
  if(!r){finish();render()}}
function ok(i){const q=Q[i],a=A[i];if(a==null)return false;if(q[1]==='x')return q[5].some(z=>nz(z)===nz(a));if(q[1]==='m')return a.slice().sort().join()===q[5].join();return a===q[5]}
function finish(){if(!run)return;run=false;clearInterval(tm);rev=warn=false;away=false;document.body.classList.remove('aw');
  const st=B.map(()=>[0,0]);Q.forEach((q,i)=>{st[q[0]][1]++;if(ok(i))st[q[0]][0]++});const tot=st.reduce((a,b)=>a+b[0],0);
  res={st,tot,pct:Math.round(tot/N*100),pass:tot/N>=.7,un:A.filter(a=>a==null).length,used:2100-left(),auto,lost};mode='result';scrollTo(0,0)}
function leave(){if(!run||away)return;away=true;lost++;document.body.classList.add('aw');}
function back(){if(!away)return;away=false;document.body.classList.remove('aw');if(run){warn=true;render()}}
document.addEventListener('visibilitychange',()=>document.hidden?leave():back());addEventListener('blur',leave);addEventListener('focus',back);
addEventListener('beforeunload',e=>{if(run){e.preventDefault();e.returnValue=''}});

const palHTML=()=>A.map((x,i)=>`<button class="${x!=null?'a':''} ${F[i]?'f':''} ${i===cur?'n':''}" data-x="g:${i}">${i+1}</button>`).join('');
function act(s){const[c,v]=s.split(':'),i=+v;
  if(c==='prt')return print();
  if(c==='ag')ag=!ag;else if(c==='go'){run=true;mode='exam';end=Date.now()+2100000;tm=setInterval(tick,1000)}
  else if(c==='p'){const q=Q[cur];if(q[1]==='m'){const t=(A[cur]||[]).slice(),j=t.indexOf(i);j<0?t.push(i):t.splice(j,1);A[cur]=t.length?t:null}else A[cur]=i}
  else if(c==='g'){rev=false;cur=i}else if(c==='pv')cur--;else if(c==='nx')cur++;else if(c==='fl')F[cur]=!F[cur];
  else if(c==='ask')rev=true;else if(c==='rv0')rev=false;else if(c==='sub')finish();else if(c==='wn')warn=false;
  else if(c==='start')view='test';else if(c==='ret')view='result';else if(c==='again')reset();
  render();if(c==='ret'||c==='start'||c==='again')scrollTo(0,0)}
function text(v){A[cur]=v.trim()?v:null;const p=document.getElementById('pal');if(p)p.innerHTML=palHTML()}
function intro(){return `<div class="card"><h2 class="qt">Python Mock Test</h2><p class="mu">Bài thi thử này giúp bạn biết trình độ Python hiện tại của mình. Không có gì phải lo — kết quả chỉ để chọn bước tiếp theo phù hợp.</p>
<div class="g2"><table class="t"><tr><td>Số câu hỏi</td><td>${N}</td></tr><tr><td>Thời gian</td><td>35 phút</td></tr><tr><td>Mốc sẵn sàng</td><td>70% (${Math.ceil(N*.7)} / ${N})</td></tr><tr><td>Dạng câu hỏi</td><td>Một / nhiều đáp án · Đúng-Sai · Kết quả code</td></tr></table>
<ol class="r" style="margin:0"><li>Đồng hồ chạy khi bạn bấm <b>Bắt đầu làm bài</b> và <b>không thể tạm dừng</b>. Hết giờ bài sẽ tự nộp.</li><li>Bạn làm bài không dùng tài liệu, người khác, công cụ tìm kiếm, AI hay trình thông dịch Python.</li><li>Bạn có thể chuyển câu, đổi đáp án và <b>đánh dấu</b> câu cần xem lại. Bạn nên trả lời đủ các câu; nếu chưa chắc bạn có thể để trống.</li><li>Câu nhiều đáp án chấm theo kiểu được-hoặc-không; câu kết quả code phải khớp chính xác.</li><li>Bạn nên ở lại trang này trong lúc làm bài để kết quả phản ánh đúng trình độ của bạn nhé.</li></ol></div>
<div class="o m${ag?' s':''}" tabindex="0" role="checkbox" aria-checked="${ag}" data-x="ag" style="margin-top:16px"><i></i><span><b>Bạn đã đọc quy chế và đồng ý tuân thủ.</b></span></div>
<div class="ft"><button class="btn" data-x="ret">← Quay lại lộ trình</button><button class="btn p" data-x="go" ${ag?'':'disabled'}>Bắt đầu làm bài</button></div></div>`}
function review(){const u=[],f=[];A.forEach((x,i)=>{if(x==null)u.push(i);if(F[i])f.push(i)});
  const jb=l=>l.map(i=>`<button class="btn" style="padding:3px 10px;margin:2px" data-x="g:${i}">${i+1}</button>`).join('')||'—';
  return `<div class="ov"><div class="md"><h3>Xem lại trước khi nộp</h3><table class="t"><tr><td>Đã trả lời</td><td>${N-u.length} / ${N}</td></tr><tr><td>Chưa trả lời</td><td>${jb(u)}</td></tr><tr><td>Đã đánh dấu</td><td>${jb(f)}</td></tr></table>${u.length?`<p class="mu">Bạn còn <b>${u.length}</b> câu chưa trả lời. Bạn có thể bấm số câu ở trên để quay lại làm tiếp, hoặc nộp bài nếu bạn thấy ổn rồi.</p>`:'<p class="mu">Sau khi nộp, đáp án không thể thay đổi.</p>'}<div class="ft" style="border:0;padding:0"><button class="btn" data-x="rv0">Quay lại bài thi</button><button class="btn p" data-x="sub">Nộp bài</button></div></div></div>`}
function exam(){const q=Q[cur],a=A.filter(x=>x!=null).length,m=q[1]==='m';
  let h=`<div class="tbar"><div><small>Câu ${cur+1} / ${N} · đã trả lời ${a}</small><div class="pt"><i style="width:${a/N*100}%"></i></div></div><div class="tmb"><small>Thời gian còn lại</small><span class="tm${left()<300?' lo':''}" id="tm">${mmss(left())}</span></div><button class="btn p" data-x="ask">Nộp bài</button></div>
<div class="gx"><div class="card"><div class="qh"><span><b>Câu ${cur+1}</b> <span class="mu">/ ${N}</span> <span class="tag">${LB[q[1]]}</span></span><button class="btn" style="padding:6px 14px;${F[cur]?'background:var(--wa);border-color:var(--wa);color:#fff':''}" data-x="fl">⚑ ${F[cur]?'Đã đánh dấu':'Đánh dấu xem lại'}</button></div><div style="font-size:18px;font-weight:600">${esc(q[2])}</div><p class="mu" style="margin:4px 0">${HT[q[1]]}</p>${q[3]?`<pre>${esc(q[3])}</pre>`:''}`;
  if(q[1]==='x')h+=`<textarea id="tx" rows="3" placeholder="Kết quả chương trình…" spellcheck="false">${esc(A[cur]||'')}</textarea>`;
  else q[4].forEach((o,k)=>{const on=m?(A[cur]||[]).includes(k):A[cur]===k;h+=`<div class="o mono${on?' s':''}" tabindex="0" role="${m?'checkbox':'radio'}" aria-checked="${on}" data-x="p:${k}"><em>${'ABCD'[k]}</em><span>${esc(o)}</span></div>`});
  h+=`<div class="ft"><button class="btn" data-x="pv" ${cur?'':'disabled'}>← Câu trước</button><button class="btn" data-x="nx" ${cur<N-1?'':'disabled'}>Câu sau →</button></div></div><div class="card pal"><h3 style="font-size:15px">Danh sách câu hỏi</h3><div id="pal">${palHTML()}</div><p class="mu" style="font-size:12px;margin-top:10px">Tô đậm: đã trả lời · viền cam: đã đánh dấu</p></div></div>`;
  if(rev)h+=review();
  if(warn)h+=`<div class="ov" style="z-index:40"><div class="md"><h3>Chào mừng bạn quay lại</h3><p>Bạn vừa rời khỏi trang làm bài. Không sao cả — bạn chỉ cần tự làm để kết quả đúng với trình độ thật của bạn nhé.</p><button class="btn p" data-x="wn">Quay lại bài thi</button></div></div>`;
  return h}
function result(){const r=res,rows=B.map((b,k)=>{const[c,t]=r.st[k];return{b,c,t,p:Math.round(c/t*100),g:c/t>=.7,need:Math.ceil(t*.7)-c}}),weak=rows.filter(x=>!x.g).sort((a,b)=>b.b[1]-a.b[1]);
  return `<div class="ban" style="background:var(${r.pass?'--ok':'--wa'})"><div style="opacity:.9;text-transform:uppercase;letter-spacing:1px;font-size:12px">Báo cáo kết quả · bài thi thử</div><h1 style="color:#fff;font-weight:600">${r.pass?'Bạn làm rất tốt!':'Một khởi đầu đáng quý'} — ${r.pct}%</h1><div>${r.tot}/${N} câu đúng · mốc sẵn sàng 70% (${Math.ceil(N*.7)}/${N})</div>${r.auto?'<div>Bài thi đã được nộp tự động sau 3 lần rời cửa sổ làm bài.</div>':''}</div>
<div class="card" style="margin-bottom:14px"><h3>Thông tin thí sinh</h3><div class="g2"><table class="t"><tr><td>Học sinh</td><td>${esc(S.name)}</td></tr><tr><td>Mã bài thi</td><td>${id}</td></tr><tr><td>Ngày</td><td>${new Date().toLocaleDateString('vi-VN')}</td></tr></table><table class="t"><tr><td>Thời gian làm bài</td><td>${r.used/60|0} phút ${r.used%60} giây / 35 phút</td></tr><tr><td>Chưa trả lời</td><td>${r.un}</td></tr><tr><td>Số lần rời cửa sổ</td><td>${r.lost}</td></tr></table></div></div>
<h3>Kết quả theo từng mảng kiến thức</h3><div class="gg">${rows.map(x=>`<div class="card"><div class="mu">Tỷ trọng trong đề thi thật ${x.b[1]}%</div><b>${esc(x.b[0])}</b><div class="br"><i style="width:${x.p}%;background:var(${x.g?'--ok':'--wa'})"></i><b></b></div><div style="display:flex;justify-content:space-between;gap:8px"><span>${x.c}/${x.t} · ${x.p}%</span><b style="color:var(${x.g?'--ok':'--wa'})">${x.g?'✔ Đạt mục tiêu':'Cần thêm '+x.need+' câu'}</b></div></div>`).join('')}</div><p class="mu">Vạch đen là mốc 70% của từng mảng.</p>
<div class="card" style="margin-bottom:14px"><h3>${weak.length?'Những mảng nên tập trung thêm':'Kết luận'}</h3>${weak.length?'<ol class="r">'+weak.map(x=>`<li><b>${esc(x.b[0])}</b> (chiếm ${x.b[1]}% đề thi thật) – bạn hãy luyện thêm rồi làm lại bài thi.</li>`).join('')+'</ol>':'<p>Cả bốn mảng đều đạt mốc 70%. Hãy tiếp tục luyện với các đoạn code mới để giữ phong độ.</p>'}</div>
${thanksCard()}<div class="ft np" style="border:0"><button class="btn" data-x="ret">← Quay lại lộ trình</button><span><button class="btn" data-x="prt">In / Lưu PDF</button> <button class="btn p" data-x="again">Làm lại bài thi</button></span></div>`}
reset();
return{html:()=>mode==='intro'?intro():mode==='exam'?exam():result(),act,text,reset,n:N,state:()=>mode};
})();
